name: CI

# The checks a change has to pass before it goes in: the type check, the build, and the whole test suite.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The tests that drive the dashboard in a real browser need the built client, so the build comes first.
      - run: npm run build
      - name: Tests
        run: npm test
        env:
          # A browser-driven test that is skipped has checked nothing. Here a missing browser is a failure.
          REQUIRE_BROWSER: '1'
          CHROME_PATH: /usr/bin/google-chrome
          # The same for the tests that run real containers: here a container service that does not answer is a failure.
          # The image comes from a mirror that does not limit how often an address may fetch.
          REQUIRE_SANDBOX: '1'
          ORG_SANDBOX_TEST_IMAGE: mirror.gcr.io/library/alpine:3.20
